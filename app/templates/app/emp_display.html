<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f8;
            padding: 40px;
        }

        h2 {
            text-align: center;
            color: #0d6efd;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            background-color: #fff;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            text-align: center;
        }

        th {
            background-color: #0d6efd;
            color: #fff;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #dbe9ff;
        }

        .emp-photo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .action-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
        }

        .edit-btn {
            background-color: #ffc107;
        }

        .delete-btn {
            background-color: #dc3545;
        }
    </style>
</head>
<body>

<h2>Employee Details</h2>

<table>
    <thead>
        <tr>
            <th>#</th>
            <th>Photo</th>
            <th>Name</th>
            <th>Gender</th>
            <th>DOB</th>
            <th>Email</th>
            <th>Contact</th>
            <th>Department</th>
            <th>Salary</th>
            <th>Edit</th>
            <th>Delete</th>
        </tr>
    </thead>
    {% if key1 %}
    <tbody>
        {% for i in key1 %}
        <tr>
            <td>{{i.id}}</td>
            <td><img src="{{i.photo.url}}" style="width: 50px;height: 50px;" srcset=""></td>
            <td>{{i.emp_name}}</td>
            <td>{{i.gender}}</td>
            <td>{{i.dob}}</td>
            <td>{{i.email}}</td>
            <td>{{i.contact}}</td>
            <td>{{i.emp_dept}}</td>
            <td>{{i.salary}}</td>
            <td>
                <form action="{% url 'editpage' pk=i.id %}" name="Editform" method="post">
                    {% csrf_token %}
                     <input type="submit" value="Edit" class="action-btn edit-btn">
                </form>
            </td>
            <td>
                <form action="{% url 'deletedata' pk=i.id %}" name="Deleteform" method="post">
                    {% csrf_token %}
                     <input type="submit" value="Delete" class="action-btn delete-btn">
                </form>
            </td>
        </tr>
        <!-- Add more employee rows here -->
        {% endfor %}
    </tbody>
    {% endif %}
</table>

</body>
</html>
