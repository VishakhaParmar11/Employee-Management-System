<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Employee</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #eef2f3, #d9e2ec);
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .form-control, .form-select {
            border-radius: 10px;
        }
        .btn-success {
            border-radius: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card p-4">
                <h3 class="text-center mb-4 text-primary">Employee Registration Form</h3>
                <!-- {% if messages %}
                    <h4 style="color: green;">{{messages}}</h4>
                {% endif %} -->

                <form method="post" enctype="multipart/form-data" action="{% url 'insertpage' %}">
                    {% csrf_token %}

                    <!-- Employee Name -->
                    <div class="mb-3">
                        <label class="form-label">Employee Name</label>
                        <input type="text" name="emp_name" class="form-control" placeholder="Enter employee name" required>
                    </div>

                    <!-- Gender (Radio Button) -->
                    <div class="mb-3">
                        <label class="form-label d-block">Gender</label>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="genderMale" value="Male" required>
                            <label class="form-check-label" for="genderMale">Male</label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="Female">
                            <label class="form-check-label" for="genderFemale">Female</label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="genderOther" value="Other">
                            <label class="form-check-label" for="genderOther">Other</label>
                        </div>
                    </div>

                    <!-- Date of Birth -->
                    <div class="mb-3">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" name="dob" class="form-control" required>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="example@gmail.com" required>
                    </div>

                    <!-- Address -->
                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <textarea name="address" class="form-control" rows="2" placeholder="Enter address" required></textarea>
                    </div>

                    <!-- Contact -->
                    <div class="mb-3">
                        <label class="form-label">Contact</label>
                        <input type="text" name="contact" class="form-control" placeholder="Enter contact number" required>
                    </div>

                    <!-- Department -->
                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <select name="emp_dept" class="form-select" required>
                            <option value="">Select Department</option>
                            <option>HR</option>
                            <option>IT</option>
                            <option>Finance</option>
                            <option>Marketing</option>
                        </select>
                    </div>

                    <!-- Salary -->
                    <div class="mb-3">
                        <label class="form-label">Salary</label>
                        <input type="number" name="salary" class="form-control" placeholder="Enter salary" required>
                    </div>

                    <!-- Photo -->
                    <div class="mb-4">
                        <label class="form-label">Employee Photo</label>
                        <input type="file" name="photo" class="form-control" required>
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success text-white">
                            Save Employee
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>


</body>
</html>
